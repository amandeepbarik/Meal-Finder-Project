<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Finder</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar meal-navbar">

        <div class="container-fluid">

            <!-- Logo -->
            <a href="#" class="navbar-brand meal-logo">
                <i class="bi bi-house-door-fill"></i>
                MEAL FINDER
            </a>

            <!-- Hidden Checkbox -->
            <input
                type="checkbox"
                id="menu-toggle"
                class="menu-toggle"
            >

            <!-- Menu Icon -->
            <label for="menu-toggle" class="menu-icon">
                <i class="bi bi-list"></i>
            </label>


            <!-- ================= SIDE MENU ================= -->

            <div class="side-menu">

                <!-- Close Button -->
                <label for="menu-toggle" class="close-menu">
                    <i class="bi bi-x-circle"></i>
                </label>

                <!-- Categories -->

                <ul class="category-list">

                    <li><a href="#">Beef</a></li>
                    <li><a href="#">Chicken</a></li>
                    <li><a href="#">Dessert</a></li>
                    <li><a href="#">Lamb</a></li>
                    <li><a href="#">Miscellaneous</a></li>
                    <li><a href="#">Pasta</a></li>
                    <li><a href="#">Pork</a></li>
                    <li><a href="#">Seafood</a></li>
                    <li><a href="#">Side</a></li>
                    <li><a href="#">Starter</a></li>
                    <li><a href="#">Vegan</a></li>
                    <li><a href="#">Vegetarian</a></li>
                    <li><a href="#">Breakfast</a></li>
                    <li><a href="#">Goat</a></li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Hero Section with Search Bar -->

    <section class="hero-banner">
        <div class="search-box-container">
            <input type="text" class="search-input" placeholder="Search recipes here ...">
            <button class="search-btn" type="button">
                <i class="bi bi-search"></i>
            </button>
        </div>
        <h1 class="hero-title">What are your favorite cuisines?</h1>
        <p class="hero-subtitle">PERSONALIZE YOUR EXPERIENCE</p>
    </section>

</body>
</html>
